
[package]
name = "rusk"
version = "0.2.0"
edition = "2021"

[dependencies]
macroquad = "0.4"
rand = "0.8"
async-recursion = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
eframe = "0.31.1"

[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "0.57", features = ["devtools"] }
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
